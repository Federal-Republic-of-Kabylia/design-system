<svg xmlns="http://www.w3.org/2000/svg" width="975" height="650" viewBox="0 0 975 650" role="img" aria-labelledby="title desc">
<title id="title">Flag of the United States of America</title>
<desc id="desc">United States flag with red and white stripes and a blue canton with white stars.</desc>
<defs>
  <polygon id="pt" points="-0.1624598481164531,0 0,-0.5 0.1624598481164531,0" transform="scale(0.0616)" fill="#FFF"/>
  <g id="star">
    <use href="#pt" transform="rotate(-144)"/>
    <use href="#pt" transform="rotate(-72)"/>
    <use href="#pt"/>
    <use href="#pt" transform="rotate(72)"/>
    <use href="#pt" transform="rotate(144)"/>
  </g>
  <g id="s5">
    <use href="#star" x="-0.232"/>
    <use href="#star" x="-0.116"/>
    <use href="#star"/>
    <use href="#star" x="0.116"/>
    <use href="#star" x="0.232"/>
  </g>
  <g id="s6">
    <use href="#s5" x="-0.058"/>
    <use href="#star" x="0.29"/>
  </g>
  <g id="x4">
    <use href="#s6"/>
    <use href="#s5" y="0.054"/>
    <use href="#s6" y="0.108"/>
    <use href="#s5" y="0.162"/>
  </g>
  <g id="u">
    <use href="#x4" y="-0.216"/>
    <use href="#x4"/>
    <use href="#s6" y="0.216"/>
  </g>
  <rect id="stripe" width="975" height="50" fill="#B31942"/>
</defs>
<rect width="975" height="650" fill="#FFF"/>
<use href="#stripe"/>
<use href="#stripe" y="100"/>
<use href="#stripe" y="200"/>
<use href="#stripe" y="300"/>
<use href="#stripe" y="400"/>
<use href="#stripe" y="500"/>
<use href="#stripe" y="600"/>
<rect width="440" height="350" fill="#0A3161"/>
<use href="#u" transform="translate(219,176) scale(650)"/>
</svg>